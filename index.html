<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>SIC Acompanhamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: navegação fixa à esquerda com os módulos do SIC, barra de retomada no topo e área de trabalho densa. Paleta e fontes seguem o próprio SIC. */
:root{
  --bg:hsl(210 25% 98%);--surface:#fff;--surface-2:hsl(212 30% 95%);--line:hsl(214 24% 87%);
  --fg:hsl(220 30% 14%);--fg-2:hsl(218 14% 36%);--fg-3:hsl(216 11% 46%);
  --pri:hsl(217 88% 48%);--pri-fg:#fff;--pri-soft:hsl(217 90% 95%);
  --ok:hsl(152 66% 26%);--ok-soft:hsl(150 55% 92%);--ok-bar:hsl(152 58% 38%);
  --err:hsl(354 70% 40%);--err-soft:hsl(354 80% 95%);--err-bar:hsl(354 70% 50%);
  --warn:hsl(30 90% 30%);--warn-soft:hsl(40 92% 91%);--warn-bar:hsl(36 92% 50%);
  --info:hsl(199 84% 28%);--info-soft:hsl(199 80% 93%);--info-bar:hsl(199 80% 45%);
  --neutro-bar:hsl(214 22% 86%);
  --nav-bg:hsl(221 36% 14%);--nav-fg:hsl(214 30% 86%);--nav-dim:hsl(216 18% 66%);--nav-hover:hsl(221 30% 21%);--nav-on:hsl(217 70% 32%);--nav-line:hsl(221 26% 24%);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(220 25% 7%);--surface:hsl(220 24% 11%);--surface-2:hsl(220 22% 15%);--line:hsl(220 18% 23%);
  --fg:hsl(212 30% 93%);--fg-2:hsl(214 18% 74%);--fg-3:hsl(214 12% 62%);
  --pri:hsl(212 96% 66%);--pri-fg:hsl(220 40% 10%);--pri-soft:hsl(217 50% 20%);
  --ok:hsl(150 56% 66%);--ok-soft:hsl(152 40% 16%);--ok-bar:hsl(150 50% 48%);
  --err:hsl(354 90% 76%);--err-soft:hsl(354 42% 20%);--err-bar:hsl(354 76% 60%);
  --warn:hsl(38 92% 68%);--warn-soft:hsl(34 50% 18%);--warn-bar:hsl(38 88% 55%);
  --info:hsl(197 86% 70%);--info-soft:hsl(199 50% 18%);--info-bar:hsl(197 76% 52%);
  --neutro-bar:hsl(220 16% 28%);
  --nav-bg:hsl(221 30% 9%);--nav-hover:hsl(221 26% 15%);--nav-on:hsl(217 56% 26%);--nav-line:hsl(221 22% 17%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(220 25% 7%);--surface:hsl(220 24% 11%);--surface-2:hsl(220 22% 15%);--line:hsl(220 18% 23%);
  --fg:hsl(212 30% 93%);--fg-2:hsl(214 18% 74%);--fg-3:hsl(214 12% 62%);
  --pri:hsl(212 96% 66%);--pri-fg:hsl(220 40% 10%);--pri-soft:hsl(217 50% 20%);
  --ok:hsl(150 56% 66%);--ok-soft:hsl(152 40% 16%);--ok-bar:hsl(150 50% 48%);
  --err:hsl(354 90% 76%);--err-soft:hsl(354 42% 20%);--err-bar:hsl(354 76% 60%);
  --warn:hsl(38 92% 68%);--warn-soft:hsl(34 50% 18%);--warn-bar:hsl(38 88% 55%);
  --info:hsl(197 86% 70%);--info-soft:hsl(199 50% 18%);--info-bar:hsl(197 76% 52%);
  --neutro-bar:hsl(220 16% 28%);
  --nav-bg:hsl(221 30% 9%);--nav-hover:hsl(221 26% 15%);--nav-on:hsl(217 56% 26%);--nav-line:hsl(221 22% 17%);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding-left:18px}
h1{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600;text-wrap:balance}
h3{font-size:13px;font-weight:600}
a{color:var(--pri)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav-bg);color:var(--nav-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:16px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;display:flex;flex-direction:column;gap:14px}
.brand{padding:2px 8px;display:grid;gap:1px}.brand b{font-size:15px;color:#fff}.brand span{font-size:12px;color:var(--nav-dim)}
.nav{display:grid;gap:1px}.nav .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-dim);padding:8px 8px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;color:inherit;text-decoration:none;font-size:13px}
.nav a:hover{background:var(--nav-hover)}.nav a.on{background:var(--nav-on);color:#fff}
.nav a small{font:11px var(--mono);color:var(--nav-dim);white-space:nowrap}.nav a.on small{color:#dbe7ff}
.nav a.dest{font-weight:600}
.nav a .alerta{color:hsl(354 90% 76%)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .menu{display:none}
.top .sp{flex:1}
.salvo{font-size:12px;color:var(--fg-3);white-space:nowrap}.salvo.erro{color:var(--err);font-weight:600}
.retoma{min-width:0;flex:0 1 auto}
main{padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;margin-inline:auto;display:grid;gap:20px;align-content:start}
main>*{min-width:0}
.cab{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.cab>div:first-child{min-width:0;flex:1 1 320px;display:grid;gap:4px}
.cab p{color:var(--fg-2);max-width:72ch}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.migalha{font-size:12px;color:var(--fg-3);display:flex;gap:6px;flex-wrap:wrap}.migalha a{color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:default}
.btn.retoma-b{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:block;background:var(--pri-soft);border-color:transparent;color:var(--pri);font-weight:600}
.btn.ok-on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.err-on{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.btn.warn-on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.conf{background:var(--err);border-color:var(--err);color:#fff}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.bloco>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.nota{color:var(--fg-3);font-size:12px}
.faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.faixa>div{padding:12px 16px;border-right:1px solid var(--line);display:grid;gap:2px}.faixa>div:last-child{border-right:0}
.faixa b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}.faixa span{font-size:12px;color:var(--fg-2)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.tabw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td a.tit{color:var(--fg);font-weight:500;text-decoration:none}td a.tit:hover{color:var(--pri);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-err{background:var(--err-soft);color:var(--err)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-info{background:var(--info-soft);color:var(--info)}
.tag{font:11px var(--mono);color:var(--fg-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.barra{display:flex;gap:2px;height:8px;min-width:120px}.barra i{display:block;border-radius:2px;min-width:0}
.b-ok{background:var(--ok-bar)}.b-err{background:var(--err-bar)}.b-warn{background:var(--warn-bar)}.b-info{background:var(--info-bar)}.b-n{background:var(--neutro-bar)}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.area:hover{border-color:var(--pri)}.area.on{border-color:var(--pri);background:var(--pri-soft)}
.area b{font-size:13px;font-weight:600}.area small{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.abas a{padding:8px 12px;color:var(--fg-2);text-decoration:none;font-weight:500;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.abas a.on{color:var(--pri);border-color:var(--pri)}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.c{display:grid;gap:3px;font-size:12px;font-weight:500;color:var(--fg-2);min-width:0}
input[type=text],input[type=search],input[type=number],input[type=month],input[type=datetime-local],input[type=url],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
textarea{resize:vertical;min-height:72px;line-height:1.45}
.filtros{display:flex;gap:8px;flex-wrap:wrap}.filtros>*{flex:0 1 150px;min-width:0}.filtros input{flex:1 1 200px}
.vazio{padding:20px;text-align:center;color:var(--fg-2);display:grid;gap:8px;justify-items:center}
.passos{display:flex;gap:4px;flex-wrap:wrap}
.pz{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:500 12px var(--mono);display:grid;place-items:center}
.pz.atual{outline:2px solid var(--pri);outline-offset:1px}.pz.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}.pz.err{background:var(--err-soft);color:var(--err);border-color:var(--err)}.pz.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.acao{font-size:15px;font-weight:500;max-width:75ch}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comp>div{display:grid;gap:6px;align-content:start;min-width:0}
.comp .esp{background:var(--surface-2);border-radius:6px;padding:10px 12px;min-height:96px}
.t{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.ev{display:grid;gap:8px}.ev-l{display:flex;gap:8px;flex-wrap:wrap}
.ev-i{border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:260px;display:grid;gap:4px;font-size:12px;min-width:0}
.ev-i img{max-height:120px;border-radius:4px;display:block}.ev-i span{overflow-wrap:anywhere}
.ev-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ev-add input[type=text]{flex:1 1 220px}
.lista{display:grid}.lista>*{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}.lista>*:last-child{border-bottom:0}
.lista .m{min-width:0;flex:1 1 220px}.lista a{font-weight:500}
.hist{display:grid}.hist>div{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.hist>div:last-child{border-bottom:0}
.hist time{font:12px var(--mono);color:var(--fg-3)}
.chk{display:grid}.chk>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}.chk>div:last-child{border-bottom:0}.chk .n{grid-column:1/-1}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}.check:last-child{border-bottom:0}
.grafico{position:relative}.grafico svg{display:block;touch-action:pan-y}
.gt{stroke:var(--line)}.gx{fill:var(--fg-3);font:11px var(--sans)}.gl{stroke:var(--pri);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.ga{fill:var(--pri);opacity:.1}.gp{fill:var(--pri);stroke:var(--surface);stroke-width:2}.gc{stroke:var(--fg-3);stroke-dasharray:3 3}
.dica{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
details>summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--pri)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:hsl(220 40% 8% / .5)}
dialog form{padding:18px;display:grid;gap:12px}
.pe{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100vw - 32px)}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.quebra{white-space:pre-wrap;overflow-wrap:anywhere}
fieldset.ro{border:0;margin:0;padding:0;min-width:0;display:grid;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
figure.cols{margin:0;display:grid;gap:10px;min-width:0}figure.cols figcaption{display:grid}figure.cols b{font-size:14px;font-weight:600}
.cols-g{display:flex;gap:6px;height:150px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.col-b{flex:1;position:relative;border-bottom:1px solid var(--line)}
.col-b i{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(34px,72%);background:var(--pri);border-radius:4px 4px 0 0;display:block}
.col-b i.parcial{background:repeating-linear-gradient(135deg,var(--pri) 0 4px,color-mix(in srgb,var(--pri) 40%,var(--surface)) 4px 8px)}
.col-b span{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.col-l{text-align:center;font-size:11px;color:var(--fg-3);white-space:nowrap}
.hm td{text-align:center;padding:6px 8px;font-variant-numeric:tabular-nums;border:2px solid var(--surface);border-radius:4px;min-width:58px}
.hm td:first-child{text-align:left;white-space:nowrap;background:none}
.hm td.z{color:var(--fg-3)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item b{font-weight:600}.item .ct{grid-column:1/-1;color:var(--fg-2)}.item .ev2{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linha{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.linha:last-child{border-bottom:0}.linha time{font:12px var(--mono);color:var(--fg-3);padding-top:2px}
.trilhas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.trilha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.trilha h2{font-size:15px}.trilha .min{font:500 13px var(--mono);color:var(--pri)}
.prep{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px}.prep input{margin-top:3px}
.ap{display:grid;gap:16px;max-width:920px;width:100%;margin-inline:auto}
.ap h1{font-size:28px}
.ap-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ap-prog{display:flex;gap:3px}.ap-prog a{flex:1;height:5px;border-radius:2px;background:var(--neutro-bar)}.ap-prog a.f{background:var(--pri)}
.fala{font-size:17px;line-height:1.55;max-width:70ch}
.msg{background:var(--pri-soft);color:var(--fg);border-radius:6px;padding:10px 14px;font-weight:600}
.tempo{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.accs{display:grid;gap:8px}.accs.in{gap:6px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}.acc.on{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.accs.in .acc{background:var(--surface-2)}
.acc-h{width:100%;background:none;border:0;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;cursor:pointer}
.acc-h:hover .acc-t{color:var(--pri)}.seta{color:var(--fg-3);width:12px;flex:none}
.acc-t{font-weight:600;min-width:0}.acc-m{flex:1 1 160px;color:var(--fg-2);font-size:13px;min-width:0}
.acc-c{padding:2px 14px 16px;display:grid;gap:12px;min-width:0}
.sub{display:grid;gap:4px;min-width:0}
.up{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid var(--line)}.up:last-child{border-bottom:0}.up-t{flex:1 1 240px;min-width:0}
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:end}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--fg)}.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}
input[type=date]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
.faixa>div .pill{justify-self:start}
.nav-f{width:100%;display:flex;justify-content:space-between;gap:8px;background:none;border:0;color:var(--nav-fg);padding:6px 8px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;text-align:left}.nav-f:hover{background:var(--nav-hover)}.nav-f small{font:11px var(--mono);color:var(--nav-dim)}
.nav-g{display:grid;gap:1px;padding-left:10px}
tr.fam td{background:var(--surface-2)}.linkb{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left}
.fala-g{font-size:15px;max-width:75ch}

.prints{display:grid;gap:8px;justify-items:start}.prints .pr-g{width:100%}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:40;transform:translateX(-102%);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.aberto{transform:none;transition:transform .18s}
  .top{position:static}
  .top .menu{display:inline-flex}

 else if(p==='custom'){ini=f('per-de')||addD(h,-29);fim=f('per-ate')||h;if(ini>fim){const x=ini;ini=fim;fim=x}rot=curto(ini)+' a '+curto(fim)}
 else{ini=INICIO_REPO;rot='Todo o histórico'}
 const dias=Math.round((Date.parse(fim)-Date.parse(ini))/864e5)+1;let ant=null;if(p!=='tudo'){const af=addD(ini,-1),ai=addD(af,-(dias-1));if(af>=INICIO_REPO)ant={ini:ai<INICIO_REPO?INICIO_REPO:ai,fim:af}}

const lerForm=form=>Object.fromEntries(new FormData(form).entries());
function rotaMod(){const r=rota();if(r.v==='modulo')return r.id;if(r.v==='teste'){const c=caso(r.id);return c&&c.m}if(r.v==='ficha')return 'ra';if(r.v==='registro'){const x=S.registros.get(r.id);return x&&x.modulo}return 'ra'}
function enviar(form){const t=form.dataset.tipo,v=lerForm(form);const erro=m=>{$('#dlg-erro').textContent=m};
  if(somenteLeitura){erro('Você tem acesso somente para consulta.');return}
  if(t==='registro'){if(!v.titulo.trim())return erro('Informe o título para salvar.');const id=novoId();const num=Math.max(0,...regs().filter(x=>x.tipo===v.tipo).map(x=>x.num||0))+1;const n={...v,num,titulo:v.titulo.trim(),evidencias:[]};salvar('registros',id,n);hist({ent:'registro',eid:id,tit:codigo(n)+' · '+n.titulo,m:v.modulo,acao:(v.tipo==='melhoria'?'Melhoria':'Bug')+' registrado'});registrarEvolucao();toast(codigo(n)+' registrado.')}
  if(t==='duvida'){if(!v.pergunta.trim())return erro('Escreva a pergunta para salvar.');const id=novoId();salvar('duvidas',id,{...v,pergunta:v.pergunta.trim(),status:'aberta'});hist({ent:'duvida',eid:id,tit:v.pergunta,m:v.modulo,acao:'Dúvida registrada'});toast('Dúvida registrada.')}
  if(t==='caso'){const passos=v.passos.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [a,e]=l.split('=>');return {a:(a||'').trim(),e:(e||'').trim()}});if(!v.titulo.trim())return erro('Informe o título do teste.');if(!passos.length||passos.some(p=>!p.a||!p.e))return erro('Cada linha precisa ter ação e esperado separados por =>.');const id='x'+novoId();salvar('casos',id,{m:v.modulo,g:v.grupo||'Geral',o:'N',t:v.titulo.trim(),obj:v.objetivo,pre:v.pre,p:passos});hist({ent:'teste',eid:id,tit:v.titulo,m:v.modulo,acao:'Teste criado'});toast('Teste criado.')}
  R.dialogo=null;salvarR();$('#dlg').close();render()}
async function enviarArquivo(file,col,id){if(!assets){toast('Anexar arquivos não está disponível para o seu acesso. Adicione um link.');return}if(file.size>20*1024*1024){toast('O arquivo passa de 20 MB. Compacte ou adicione um link.');return}toast('Enviando '+(file.name||'arquivo')+'…');try{const ext=(file.name||'').toLowerCase();const type=file.type&&!file.type.includes(';')?file.type:ext.endsWith('.csv')?'text/csv':ext.endsWith('.json')?'application/json':'text/plain';const up=await assets.upload(file,{type});addEv(col,id,{tipo:'arquivo',id:up.id,nome:file.name||'Print colado',mime:up.contentType,em:agora()});toast('Evidência anexada.')}catch(e){toast(e&&e.code==='unsupported_type'?'Tipo de arquivo não aceito. Use imagem, vídeo, PDF ou texto.':e&&e.code==='too_large'?'O arquivo é grande demais.':'Não foi possível anexar. Tente novamente.')}}
function alvoHist(col,id){if(col==='resultados'){const c=caso(id);return {ent:'teste',eid:id,tit:c&&c.t,m:c&&c.m}}if(col==='registros'){const r=S.registros.get(id);return {ent:'registro',eid:id,tit:r&&codigo(r),m:r&&r.modulo}}return {ent:'ficha',eid:id,tit:(S.fichas.get(id)||{}).contrato||'Ficha',m:'ra'}}
function addEv(col,id,e){const a=(S[col].get(id)||{}).evidencias||[];salvar(col,id,{evidencias:[...a,e]});hist({...alvoHist(col,id),acao:'Evidência adicionada'});render()}
/* eventos */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,r=rota(),c=r.v==='teste'?caso(r.id):null;
  if(a==='menu')return $('#side').classList.toggle('aberto');
  if(a==='prep'){salvar('roteiro','prep-'+b.dataset.k,{ok:b.checked});return render()}
  if(a==='fechar'){R.dialogo=null;salvarR();return $('#dlg').close()}
  if(a==='area'){R.filtros['area-ra']=b.dataset.k;salvarR();return render()}
  if(a==='ir'){R.passo[c.id]=Number(b.dataset.n);salvarR();render();return window.scrollTo(0,0)}
  if(a==='res'){const i=R.passo[c.id];flush();return definirPasso(c,i,b.dataset.r)}
  if(a==='novo-reg')return abrirDlg('registro',{modulo:b.dataset.m});
  if(a==='nova-duv')return abrirDlg('duvida',{modulo:b.dataset.m});
  if(a==='novo-caso')return abrirDlg('caso',{modulo:b.dataset.m});
  if(a==='bug-passo'){const i=R.passo[c.id],p=c.p[i],v=((S.resultados.get(c.id)||{}).passos||{})[i]||{};return abrirDlg('registro',{modulo:c.m,titulo:c.t+' · passo '+(i+1),descricao:p.a,esperado:p.e,atual:v.atual||'',casoId:c.id,passo:i,prioridade:'alta'})}
  if(a==='duv-passo'){const i=R.passo[c.id],p=c.p[i];return abrirDlg('duvida',{modulo:c.m,contexto:`${c.t}, passo ${i+1}: ${p.a}`,casoId:c.id})}
  if(a==='bug-ficha'){const x=S.fichas.get(b.dataset.id)||{},e=checarFicha(x).filter(i=>i.e==='err');return abrirDlg('registro',{modulo:'ra',titulo:'Relatório automático divergente: '+(x.contrato||'contrato'),descricao:'Competência '+(x.competencia||'não informada'),atual:e.map(i=>i.t+': '+i.m).join('\n'),prioridade:'alta'})}
  if(a==='chk'){const id=b.dataset.id,atual=(S.checklist.get(id)||{}).status,novo=atual===b.dataset.s?'':b.dataset.s;salvar('checklist',id,{status:novo});hist({ent:'checklist',eid:id,tit:b.dataset.t,m:b.dataset.m,acao:'Checklist',de:(ST_CHK[atual]||['Pendente'])[0],para:(ST_CHK[novo]||['Pendente'])[0]});return render()}
  if(a==='nova-ficha'){const id=novoId();salvar('fichas',id,{origem:'auto',evidencias:[]});hist({ent:'ficha',eid:id,tit:'Nova ficha',m:'ra',acao:'Ficha criada'});location.hash='f-'+id;return}
  if(a==='ev-add'){const inp=document.getElementById('ev-txt-'+b.dataset.id),t=inp.value.trim();if(!t)return toast('Cole um link ou descreva a evidência.');return addEv(b.dataset.col,b.dataset.id,linkSeguro(t)?{tipo:'link',url:t,nome:t,em:agora()}:{tipo:'texto',nome:t,em:agora()})}
  if(a==='ev-del'){const col=b.dataset.col,id=b.dataset.id,l=[...((S[col].get(id)||{}).evidencias||[])];l.splice(Number(b.dataset.i),1);salvar(col,id,{evidencias:l});hist({...alvoHist(col,id),acao:'Evidência removida'});return render()}
  if(a==='na'){const st=stCaso(c.id),r0=S.resultados.get(c.id)||{};const novo=st==='na'?recalc(c,{...r0,status:''}):'na';salvar('resultados',c.id,{status:novo});hist({ent:'teste',eid:c.id,tit:c.t,m:c.m,acao:'Status do teste',de:ST_CASO[st][1],para:ST_CASO[novo][1]});registrarEvolucao();return render()}
  if(a==='reset'){const k='reset-'+c.id;if(confirmando!==k){confirmando=k;render();setTimeout(()=>{if(confirmando===k){confirmando='';render()}},5000);return}confirmando='';const st=stCaso(c.id);salvar('resultados',c.id,{passos:{},status:'nao_iniciado',observacao:''});R.passo[c.id]=0;salvarR();hist({ent:'teste',eid:c.id,tit:c.t,m:c.m,acao:'Teste reiniciado',de:ST_CASO[st][1],para:ST_CASO.nao_iniciado[1]});registrarEvolucao();return render()}
});
const historiaAntes=new WeakMap();
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.bind){const [c,i,k]=e.target.dataset.bind.split('|');historiaAntes.set(e.target,(S[c].get(i)||{})[k]??'')}});
document.addEventListener('focusout',()=>{if(pendente)setTimeout(()=>{if(pendente&&!focoEditando())render()},220)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.closest&&t.closest('#dlg form')){R.dialogo.v=lerForm(t.closest('form'));salvarR();return}
  if(t.dataset.filtro){R.filtros[t.dataset.filtro]=t.value;salvarR();if(t.tagName==='INPUT'){clearTimeout(t._f);const id=t.id;t._f=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos)}},220)}return}
  if(t.dataset.passo!==undefined){const id=t.dataset.caso,i=t.dataset.passo,c=caso(id),r=S.resultados.get(id)||{},p=JSON.parse(JSON.stringify(r.passos||{}));p[i]={...(p[i]||{}),atual:t.value};const antes=stCaso(id);const novo=recalc(c,{...r,passos:p});salvar('resultados',id,{passos:p,status:novo,ambiente:r.ambiente||R.ambiente});if(novo!==antes){hist({ent:'teste',eid:id,tit:c.t,m:c.m,acao:'Status do teste',de:ST_CASO[antes][1],para:ST_CASO[novo][1]});atualizaLateral()}return}
  if(t.dataset.bind&&t.tagName!=='SELECT'){const [c,i,k]=t.dataset.bind.split('|');salvar(c,i,{[k]:t.value});if(t.dataset.ficha){const el=$('#ficha-c');if(el)el.innerHTML=checksHtml(S.fichas.get(i))}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.evFile){const [c,i]=t.dataset.evFile.split('|');if(t.files[0])enviarArquivo(t.files[0],c,i);return}
  if(t.dataset.filtro){R.filtros[t.dataset.filtro]=t.value;salvarR();if(t.dataset.render)render();return}
  if(t.dataset.passo!==undefined){const c=caso(t.dataset.caso);if(t.value)hist({ent:'teste',eid:c.id,tit:c.t,m:c.m,acao:'Comportamento atual do passo '+(Number(t.dataset.passo)+1)+' atualizado'});return}
  if(t.dataset.bind){const [c,i,k]=t.dataset.bind.split('|');const antes=historiaAntes.has(t)?historiaAntes.get(t):((S[c].get(i)||{})[k]??'');if(t.tagName==='SELECT'){salvar(c,i,{[k]:t.value})}
    if(t.dataset.ficha){const x=S.fichas.get(i);const el=$('#ficha-c');if(el)el.innerHTML=checksHtml(x);if(k==='contrato'&&t.value)hist({ent:'ficha',eid:i,tit:t.value,m:'ra',acao:'Ficha atualizada'})}
    if(t.dataset.hist&&String(antes)!==String(t.value)){const map=t.dataset.map==='PRIOR'?PRIOR:t.dataset.map==='ST_REG'?ST_REG:t.dataset.map==='ST_DUV'?ST_DUV:null;const lbl=v=>map&&map[v]?map[v][0]:v;hist({ent:t.dataset.ent,eid:t.dataset.eid,tit:t.dataset.tit,m:t.dataset.m,acao:t.dataset.hist,de:lbl(antes),para:lbl(t.value)});if(c==='registros')registrarEvolucao()}
    historiaAntes.set(t,t.value);if(t.dataset.render)render()}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.closest('#dlg'))enviar(e.target)});
document.addEventListener('paste',e=>{if($('#dlg').open)return;const ev=$('[data-ev]');if(!ev||!assets)return;const f=[...(e.clipboardData?.files||[])][0];if(!f)return;e.preventDefault();const [c,i]=ev.dataset.ev.split('|');enviarArquivo(f,c,i)});
$('#dlg').addEventListener('close',()=>{$('#dlg').innerHTML='';});
$('#dlg').addEventListener('cancel',()=>{R.dialogo=null;salvarR()});
let navegou=false;
window.addEventListener('hashchange',()=>{flush();navegou=true;$('#side').classList.remove('aberto');R.hash=location.hash.slice(1);salvarR();render();window.scrollTo(0,R.scroll[R.hash]||0)});
let scT;window.addEventListener('scroll',()=>{clearTimeout(scT);scT=setTimeout(()=>{R.scroll[location.hash.slice(1)||'dash']=Math.round(window.scrollY);salvarR()},500)},{passive:true});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(rota().v==='painel'&&!focoEditando())render()},200)});
window.addEventListener('pagehide',()=>{flush();lsSet('retomada',R)});
/* ========= INÍCIO ========= */
function aplicarRetomada(){const des=location.hash.slice(1);if(!des&&R.hash&&R.hash!=='dash'){location.hash=R.hash;return true}R.hash=des||'dash';return false}
function restaurarDialogo(){if(R.dialogo&&R.dialogo.tipo&&!$('#dlg').open){const d=R.dialogo;abrirDlg(d.tipo,d.v)}}
async function iniciar(){const lr=lsGet('retomada');if(lr)R={...R,...lr};const moveu=aplicarRetomada();if(!moveu){render();window.scrollTo(0,R.scroll[R.hash]||0)}
  const cl=window.claude;
  if(cl&&cl.use){const [d,u,a]=await Promise.all(['db','user','assets'].map(n=>cl.use(n).catch(()=>null)));db=d;usuario=u;assets=a}
  if(!db){modo='local';carregarLocal();render();restaurarDialogo();indicador();return}
  modo='db';
  try{if(usuario){uid=await usuario.id();const pode=usuario.can?await usuario.can('data.write'):null;if(pode===false)somenteLeitura=true}}catch{}
  if(uid){try{const s=await db.doc('data/users/'+uid+'/retomada').get();if(s.exists){const nr=JSON.parse(JSON.stringify(s.data()));if(!lr||String(nr.em)>String(lr.em)){R={...R,...nr};if(!navegou){const alvo=R.hash||'dash';if(alvo!==(location.hash.slice(1)||'dash'))location.hash=alvo}}}}catch{}}
  timerCarga=setTimeout(()=>{avisoCarga=true;agendar()},10000);
  COLS.forEach(assinar);
  render();restaurarDialogo();indicador();resolverNomes();setTimeout(()=>window.scrollTo(0,R.scroll[location.hash.slice(1)||'dash']||0),400)}
iniciar();
</script>
